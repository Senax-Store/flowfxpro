name: Build FlowFx Pro
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyinstaller pyaudiowpatch pycaw comtypes
      - run: pyinstaller --noconfirm --onefile --noconsole --uac-admin --name FlowFxPro --hidden-import pyaudiowpatch --hidden-import pycaw.pycaw --hidden-import comtypes.client FlowFxPro.py
      - name: Get FFmpeg
        run: |
          Invoke-WebRequest https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -OutFile ff.zip
          Expand-Archive ff.zip ff
          Get-ChildItem ff -Recurse -Include ffmpeg.exe,ffprobe.exe | Copy-Item -Destination dist
      - run: choco install innosetup -y
      - run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: FlowFx Pro (latest)
          files: Output/FlowFxPro_Setup.exe
